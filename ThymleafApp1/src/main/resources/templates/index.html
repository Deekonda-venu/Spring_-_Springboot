<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customer Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        form {
            margin-bottom: 20px;
        }
        input {
            padding: 5px;
            margin: 5px;
        }
        button {
            padding: 8px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
<h1>Customer Management</h1>

<form action="#" th:action="@{/save}" th:object="${customer}" method="post">
    <input type="text" th:field="*{Cname}" placeholder="Name" required />
    <input type="email" th:field="*{Cemail}" placeholder="Email" required />
    <input type="text" th:field="*{Cphone}" placeholder="Phone" required />
    <button type="submit">Save Customer</button>
</form>

<h2>Customer List</h2>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="customer : ${customers}">
        <td th:text="${customer.id}"></td>
        <td th:text="${customer.Cname}"></td>
        <td th:text="${customer.Cemail}"></td>
        <td th:text="${customer.Cphone}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
